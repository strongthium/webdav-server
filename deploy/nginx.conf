# webdav-server behind nginx. The server listens in the clear on the loopback address, which takes this in its
# webdav-server.json, and a restart:
#
#   "listen": [{ "address": "127.0.0.1", "port": 8080, "tls": false }]
#
# Then, in the admin window, on the Proxy page: add 127.0.0.1 to the trusted proxies, and, if Cloudflare is in front of this
# nginx as well, tick Behind Cloudflare. Logins are refused unless X-Forwarded-Proto says https all the way from the client.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name files.example.com;

    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # What's uploaded goes straight through to the server, which holds it to the quotas as it arrives and keeps it safe until
    # it's whole. Left at their defaults, these turn a large upload into a large file in nginx's own temporary folder, or a 413.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Host as the client sent it, for the addresses in Nextcloud's login, and for clients' Destination headers.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Added to, not replaced: the server reads it from the right, and ignores what clients wrote further left.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # If this is under a longer address, say /files/ rather than /: tell the server, so that the addresses it gives back fit.
    #
    # location /files/ {
    #     proxy_pass http://127.0.0.1:8080/;
    #     proxy_set_header X-Forwarded-Prefix /files;
    #     ...
    # }
}
